name: latent-agents
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyTorch CUDA wheels
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.7.0+cu126

      # HuggingFace stack
      - transformers>=4.51.0
      - datasets>=2.20.0
      - tokenizers
      - sentencepiece
      - protobuf

      - safetensors
